# Render blueprint — one-click deploy from GitHub.
# Dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: ecommerce-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # For persistent data on cloud, set DATABASE_URL to a Postgres URL
      # (e.g. from Render Postgres or Supabase). Without it, SQLite is used
      # and data resets on redeploy.
      # - key: DATABASE_URL
      #   sync: false
