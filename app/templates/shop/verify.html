{% extends "shop/base.html" %}
{% block title %}Verify your number{% endblock %}
{% block body %}
<div class="authbox">
  <h1>Verify your mobile</h1>
  <p class="muted">We sent a 6-digit code to <strong>{{ phone }}</strong>.</p>
  {% if dev_otp %}<div class="alert">Dev mode — your OTP is <strong>{{ dev_otp }}</strong></div>{% endif %}
  {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
  <form method="post" action="/shop/verify" class="authform">
    <input type="hidden" name="phone" value="{{ phone }}">
    <label>Enter OTP<input type="text" name="code" inputmode="numeric" maxlength="6"
      pattern="[0-9]{6}" placeholder="6-digit code" required></label>
    <button type="submit" class="cta big">Verify</button>
  </form>
</div>
{% endblock %}
